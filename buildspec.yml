version: 0.2

phases:
  install:
    commands:
      - npm config set registry https://registry.npmjs.org/
      - npm install
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - '**/*'
  base-directory: 'dist/sss'

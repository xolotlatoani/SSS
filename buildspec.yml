version: 0.2

phases:
  pre_build:
    commands:
      - echo Build started on `date`
  build:
    commands:
      - npm install
      - npm run build
  post_build:
    commands:
      - echo Build completed on `date`
      - pwd
      - ls -la ./dist/sss

artifacts:
  files:
    - '**/*'
  base-directory: './dist/sss'
